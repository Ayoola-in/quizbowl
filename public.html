<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0B1222">
    <title>QuizBowl - Public Display</title>

    <!-- Apply saved theme before first paint to avoid a flash -->
    <script>
        try {
            var savedTheme = localStorage.getItem('quizbowl_theme');
            if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        } catch (e) {}
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/public.css">

    <!-- MathJax for rendering Mathematical Expressions -->
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head>

<body class="public-body">

    <header class="public-header">
        <div class="logo">
            <span class="logo-icon"><span data-icon="trophy"></span></span>
            <span>
                <h1>QuizBowl</h1>
                <small id="quiz-name">Live Quiz</small>
            </span>
        </div>
        <div class="scoreboard" id="scoreboard" aria-label="Scoreboard"></div>
        <div style="display: flex; gap: 0.25rem;">
            <button class="btn btn-ghost btn-icon" id="btn-theme" aria-label="Toggle dark mode"><span data-icon="moon"></span></button>
            <button class="btn btn-ghost btn-icon" id="btn-fullscreen" aria-label="Toggle fullscreen" title="Toggle fullscreen (F)"><span data-icon="maximize"></span></button>
        </div>
    </header>

    <main class="public-main">
        <!-- Question picker -->
        <section class="picker" id="picker">
            <h2>Pick a question</h2>
            <p>Choose a category, then enter a question number.</p>

            <div class="segmented" id="type-tabs" role="tablist" aria-label="Question type"></div>

            <form class="picker-form" id="picker-form" autocomplete="off">
                <input type="text" id="public-search" class="picker-input" inputmode="numeric"
                    placeholder="Question number, e.g. 7" aria-label="Question number">
                <button type="submit" id="btn-search" class="btn btn-primary">Show Question</button>
            </form>
            <div class="key-hints">
                <span><kbd>Enter</kbd> show question</span>
                <span><kbd>A</kbd> reveal answer</span>
                <span><kbd>Esc</kbd> back to picker</span>
                <span><kbd>F</kbd> fullscreen</span>
            </div>

            <div class="number-board">
                <div class="number-board-head">
                    <h3>Available</h3>
                    <span id="available-count"></span>
                </div>
                <div class="number-grid" id="available-grid"></div>
            </div>
            <div class="number-board" id="answered-board">
                <div class="number-board-head">
                    <h3>Already answered</h3>
                    <span id="answered-count"></span>
                </div>
                <div class="number-grid" id="answered-grid"></div>
            </div>
        </section>

        <!-- Question stage -->
        <section id="question-display" class="question-display" hidden>
            <div class="qd-top">
                <div class="qd-info">
                    <span class="qd-number" id="qd-id"></span>
                    <span id="qd-type"></span>
                    <span class="qd-pill" id="qd-category"></span>
                    <span class="qd-pill marks" id="qd-marks"></span>
                </div>
                <div class="qd-controls">
                    <div class="timer" id="qd-timer" hidden>
                        <svg viewBox="0 0 88 88" aria-hidden="true">
                            <circle class="track" cx="44" cy="44" r="40"></circle>
                            <circle class="progress" id="timer-progress" cx="44" cy="44" r="40"></circle>
                        </svg>
                        <span class="timer-value" id="timer-value">00</span>
                    </div>
                    <button id="btn-toggle-answer" class="btn btn-secondary btn-lg"><span data-icon="eye"></span><span>Show Answer</span></button>
                    <button id="btn-cancel-display" class="btn btn-ghost btn-icon btn-lg" aria-label="Close question" title="Close (Esc)" style="width: 48px;"><span data-icon="x"></span></button>
                </div>
            </div>

            <div id="qd-answered-warning"></div>

            <div class="qd-stage" id="qd-stage">
                <div class="times-up" id="times-up" hidden>
                    <h3>Time's up!</h3>
                    <button id="btn-start-bonus" class="btn btn-primary btn-lg"><span data-icon="zap"></span> Start Bonus Time</button>
                </div>
                <div id="qd-content">
                    <div id="qd-body" class="qd-body"></div>
                    <div id="qd-options" class="options-grid"></div>
                </div>
            </div>

            <div id="qd-answer-section" class="answer-panel" hidden>
                <h3>Correct answer</h3>
                <div id="qd-correct-answer"></div>
            </div>

            <div id="qd-scoring-controls" class="scoring-controls" hidden>
                <h3>Who answered correctly?</h3>
                <div id="team-buttons-container" class="team-buttons"></div>
                <button class="btn btn-ghost" id="btn-no-winner">No one — close question</button>
            </div>
        </section>
    </main>

    <!-- Celebration Overlay -->
    <div id="celebration-overlay" class="celebration" hidden role="dialog" aria-live="assertive">
        <h1 id="celebration-text" class="celebration-title"></h1>
        <div id="celebration-sub" class="celebration-sub"></div>
        <div id="celebration-leaderboard" class="celebration-leaderboard"></div>
        <p class="celebration-hint">Click anywhere or press Esc to continue</p>
    </div>

    <!-- Application Core & Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="js/app.js"></script>
    <script src="js/data/storage.js"></script>
    <script src="js/data/questions-db.js"></script>
    <script src="js/data/teams-db.js"></script>
    <script src="js/data/history-db.js"></script>
    <script src="js/data/settings-db.js"></script>
    <script src="js/data/seed-data.js"></script>
    <script src="js/data/quizzes-db.js"></script>
    <script src="js/services/question-service.js"></script>
    <script src="js/services/team-service.js"></script>
    <script src="js/services/scoring-service.js"></script>
    <script src="js/utils/search.js"></script>
    <script src="js/utils/ui.js"></script>
    <script src="js/components/toast.js"></script>

    <!-- Public Display Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const UI = window.QuizBowl.Utils.UI;
            const QuestionService = window.QuizBowl.Services.QuestionService;
            const TeamService = window.QuizBowl.Services.TeamService;
            const Toast = window.QuizBowl.Components.Toast;
            const QuizzesDB = window.QuizBowl.Data.QuizzesDB;

            QuizzesDB.ensureInitialized();

            const TYPE_PREFIXES = {
                'theory': 'THRY',
                'calculation': 'CALC',
                'mcq': 'MCQ',
                'true_false': 'TF'
            };
            const TYPE_ORDER = ['theory', 'calculation', 'mcq', 'true_false'];

            const picker = document.getElementById('picker');
            const pickerForm = document.getElementById('picker-form');
            const searchInput = document.getElementById('public-search');
            const display = document.getElementById('question-display');
            const typeTabs = document.getElementById('type-tabs');
            const timerEl = document.getElementById('qd-timer');
            const timerValue = document.getElementById('timer-value');
            const timerProgress = document.getElementById('timer-progress');
            const timesUp = document.getElementById('times-up');
            const btnBonus = document.getElementById('btn-start-bonus');
            const btnToggleAnswer = document.getElementById('btn-toggle-answer');
            const answerSection = document.getElementById('qd-answer-section');
            const scoringControls = document.getElementById('qd-scoring-controls');
            const overlay = document.getElementById('celebration-overlay');

            const RING_LENGTH = 2 * Math.PI * 40;
            timerProgress.style.strokeDasharray = RING_LENGTH;

            let currentType = 'theory';
            let currentQuestionId = null;
            let timerInterval = null;
            let confettiInterval = null;

            // ---------- Theme & fullscreen ----------
            window.QuizBowl.Theme.syncButton();
            document.getElementById('btn-theme').addEventListener('click', () => {
                window.QuizBowl.Theme.set(!window.QuizBowl.Theme.isDark());
            });

            function toggleFullscreen() {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(err => console.log(err));
                } else {
                    document.exitFullscreen().catch(err => console.log(err));
                }
            }
            document.getElementById('btn-fullscreen').addEventListener('click', toggleFullscreen);

            // ---------- Quiz name ----------
            function renderQuizName() {
                const quiz = QuizzesDB.getActive();
                document.getElementById('quiz-name').textContent = quiz ? quiz.name : 'Live Quiz';
                document.title = `${quiz ? quiz.name + ' · ' : ''}QuizBowl Live`;
            }

            // ---------- Scoreboard ----------
            function renderScoreboard() {
                const teams = TeamService.getAllTeams();
                document.getElementById('scoreboard').innerHTML = teams.map(t => `
                    <span class="score-pill" title="${UI.escapeHtml(t.name)}">
                        <span class="team-avatar" style="background: ${UI.teamColor(t)};">${UI.escapeHtml(UI.initials(t.name))}</span>
                        ${UI.escapeHtml(t.name)}
                        <strong>${t.score}</strong>
                    </span>
                `).join('');
            }

            // ---------- Picker ----------
            function numberOf(q) {
                return parseInt(q.id.replace(TYPE_PREFIXES[q.type] || '', ''), 10) || q.id;
            }

            function renderPicker() {
                const questions = QuestionService.getAllQuestions();

                typeTabs.innerHTML = TYPE_ORDER.map(type => {
                    const available = questions.filter(q => q.type === type && q.status === 'available').length;
                    const active = type === currentType;
                    return `<button type="button" role="tab" data-type="${type}" class="${active ? 'active' : ''}" aria-selected="${active}">
                        ${UI.typeLabel(type)}<span class="count">${available}</span>
                    </button>`;
                }).join('');

                const ofType = questions.filter(q => q.type === currentType);
                const available = ofType.filter(q => q.status === 'available');
                const answered = ofType.filter(q => q.status === 'answered');

                document.getElementById('available-count').textContent = `${available.length} of ${ofType.length}`;
                document.getElementById('available-grid').innerHTML = available.length
                    ? available.map(q => `<button class="number-chip" data-id="${UI.escapeHtml(q.id)}" title="${UI.escapeHtml(q.id)}">${numberOf(q)}</button>`).join('')
                    : `<p class="text-muted" style="grid-column: 1 / -1;">${ofType.length
                        ? 'Every question in this category has been answered.'
                        : 'No questions in this category yet. Add some from the admin page.'}</p>`;

                document.getElementById('answered-board').hidden = answered.length === 0;
                document.getElementById('answered-count').textContent = answered.length;
                document.getElementById('answered-grid').innerHTML = answered.map(q => {
                    const team = TeamService.getTeam(q.answeredBy);
                    return `<button class="number-chip answered" data-id="${UI.escapeHtml(q.id)}" title="Answered by ${UI.escapeHtml(team ? team.name : 'unknown team')}">
                        ${numberOf(q)}<span class="chip-dot" style="background: ${UI.teamColor(team)};"></span>
                    </button>`;
                }).join('');
            }

            function showPicker() {
                stopTimer();
                currentQuestionId = null;
                display.hidden = true;
                picker.hidden = false;
                renderPicker();
                renderScoreboard();
                searchInput.focus();
            }

            typeTabs.addEventListener('click', (e) => {
                const btn = e.target.closest('button[data-type]');
                if (!btn) return;
                currentType = btn.getAttribute('data-type');
                renderPicker();
                searchInput.focus();
            });

            picker.addEventListener('click', (e) => {
                const chip = e.target.closest('.number-chip');
                if (chip) displayQuestion(chip.getAttribute('data-id'));
            });

            pickerForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const query = searchInput.value.trim();
                if (!query) {
                    searchInput.focus();
                    return;
                }

                // If they typed just a number, pad it and prefix it; otherwise treat it as a full ID (e.g. THRY001)
                const finalId = !isNaN(query)
                    ? TYPE_PREFIXES[currentType] + String(parseInt(query, 10)).padStart(3, '0')
                    : query.toUpperCase();

                if (displayQuestion(finalId)) {
                    searchInput.value = '';
                } else {
                    searchInput.classList.remove('shake');
                    void searchInput.offsetWidth; // restart the animation
                    searchInput.classList.add('shake');
                    searchInput.select();
                }
            });

            searchInput.addEventListener('animationend', () => searchInput.classList.remove('shake'));

            // ---------- Timer ----------
            function stopTimer() {
                if (timerInterval) clearInterval(timerInterval);
                timerInterval = null;
            }

            function setBlurred(isBlurred) {
                document.getElementById('qd-content').classList.toggle('blurred', isBlurred);
            }

            function renderTimer(remaining, duration) {
                timerValue.textContent = remaining < 10 ? '0' + remaining : remaining;
                const fraction = duration > 0 ? remaining / duration : 0;
                timerProgress.style.strokeDashoffset = RING_LENGTH * (1 - fraction);
                timerEl.classList.toggle('warning', remaining > 0 && remaining <= 5);
                timerEl.classList.toggle('done', remaining === 0);
            }

            function startTimer(duration, isBonus = false) {
                stopTimer();
                let remaining = duration;
                timerEl.hidden = false;
                timerEl.classList.toggle('bonus', isBonus);
                // Jump the ring to full without animating backwards
                timerProgress.style.transition = 'none';
                renderTimer(remaining, duration);
                void timerProgress.getBoundingClientRect();
                timerProgress.style.transition = '';

                timerInterval = setInterval(() => {
                    remaining = Math.max(0, remaining - 1);
                    renderTimer(remaining, duration);

                    if (remaining === 0) {
                        stopTimer();
                        const q = QuestionService.getQuestion(currentQuestionId);
                        if (q && q.status !== 'answered') {
                            setBlurred(true);
                            timesUp.hidden = false;
                            // A bonus round is offered only once, after the main timer
                            btnBonus.hidden = isBonus;
                        }
                    }
                }, 1000);
            }

            btnBonus.addEventListener('click', () => {
                const settings = window.QuizBowl.Data.SettingsDB.getSettings();
                timesUp.hidden = true;
                setBlurred(false);
                startTimer(settings.bonusTime, true);
            });

            // ---------- Answer reveal ----------
            function setAnswerVisible(visible) {
                answerSection.hidden = !visible;
                document.getElementById('qd-options').classList.toggle('revealed', visible);
                btnToggleAnswer.innerHTML = `${UI.icon(visible ? 'eyeOff' : 'eye')}<span>${visible ? 'Hide Answer' : 'Show Answer'}</span>`;
            }

            btnToggleAnswer.addEventListener('click', () => setAnswerVisible(answerSection.hidden));

            document.getElementById('btn-cancel-display').addEventListener('click', showPicker);
            document.getElementById('btn-no-winner').addEventListener('click', showPicker);

            // ---------- Question display ----------
            function displayQuestion(id) {
                const q = QuestionService.getQuestion(id);
                if (!q) {
                    Toast.show(`Question ${id} was not found.`, 'danger');
                    return false;
                }

                currentQuestionId = q.id;
                currentType = q.type;

                document.getElementById('qd-id').textContent = `Question ${numberOf(q)}`;
                document.getElementById('qd-type').innerHTML = UI.typeChip(q.type);
                document.getElementById('qd-category').textContent = q.category || 'General';
                document.getElementById('qd-marks').textContent = `${q.marks} pts`;

                const warning = document.getElementById('qd-answered-warning');
                if (q.status === 'answered') {
                    const team = TeamService.getTeam(q.answeredBy);
                    warning.innerHTML = `
                        <div class="callout callout-danger answered-callout">
                            ${UI.icon('alert')}
                            <div>
                                <strong>This question has already been answered</strong>
                                Answered by ${team
                                    ? `<span class="team-name" style="vertical-align: middle;"><span class="team-dot" style="background: ${UI.teamColor(team)};"></span>${UI.escapeHtml(team.name)}</span>`
                                    : 'a team that no longer exists'}
                            </div>
                        </div>
                    `;
                } else {
                    warning.innerHTML = '';
                }

                document.getElementById('qd-body').innerHTML = q.question;

                const optionsContainer = document.getElementById('qd-options');
                if (q.type === 'mcq' && q.options) {
                    optionsContainer.innerHTML = Object.entries(q.options).map(([key, val]) => `
                        <div class="option-card ${key === q.correctAnswer ? 'correct' : ''}">
                            <span class="option-letter">${key}</span>
                            <span>${val}</span>
                        </div>
                    `).join('');
                } else {
                    optionsContainer.innerHTML = '';
                }

                // Prepare correct answer display
                const correctAnswerElem = document.getElementById('qd-correct-answer');
                if (q.type === 'mcq' && q.options && q.correctAnswer && q.options[q.correctAnswer]) {
                    correctAnswerElem.innerHTML = `${q.correctAnswer}: ${q.options[q.correctAnswer]}`;
                } else {
                    const answer = q.correctAnswer || q.expectedAnswer;
                    correctAnswerElem.innerHTML = answer ? `${answer} ${q.unit ? UI.escapeHtml(q.unit) : ''}` : 'Not provided';
                }

                setAnswerVisible(false);
                setBlurred(false);
                timesUp.hidden = true;

                if (q.status !== 'answered') {
                    const settings = window.QuizBowl.Data.SettingsDB.getSettings();
                    let duration = 15;
                    if (q.type === 'theory') duration = settings.theoryTime;
                    else if (q.type === 'calculation') duration = settings.calculationTime;
                    else if (q.type === 'mcq') duration = settings.mcqTime;
                    else if (q.type === 'true_false') duration = settings.true_falseTime;

                    startTimer(duration);

                    const teams = TeamService.getAllTeams();
                    document.getElementById('team-buttons-container').innerHTML = teams.length
                        ? teams.map(t => `
                            <button class="team-score-btn" data-team="${UI.escapeHtml(t.id)}" style="--team: ${UI.teamColor(t)};">
                                <span class="team-avatar">${UI.escapeHtml(UI.initials(t.name))}</span>
                                ${UI.escapeHtml(t.name)}
                            </button>
                        `).join('')
                        : `<p class="text-muted">No teams registered. Add teams from the admin page.</p>`;

                    scoringControls.hidden = false;
                } else {
                    stopTimer();
                    timerEl.hidden = true;
                    scoringControls.hidden = true;
                }

                picker.hidden = true;
                display.hidden = false;
                btnToggleAnswer.focus();

                // Trigger MathJax re-render
                if (window.MathJax && MathJax.typesetPromise) {
                    MathJax.typesetPromise([display]).catch(err => console.error(err));
                }
                return true;
            }

            // ---------- Scoring & celebration ----------
            document.getElementById('team-buttons-container').addEventListener('click', (e) => {
                const btn = e.target.closest('.team-score-btn');
                if (!btn || !currentQuestionId) return;

                const teamId = btn.getAttribute('data-team');
                const q = QuestionService.getQuestion(currentQuestionId);
                const t = TeamService.getTeam(teamId);
                if (!q || !t) return;

                // Record Score (assuming correct)
                stopTimer();
                try {
                    window.QuizBowl.Services.ScoringService.awardMarks(q.id, teamId, q.marks, 'correct');
                } catch (err) {
                    Toast.show(err.message, 'danger');
                    return;
                }

                scoringControls.hidden = true;
                setBlurred(false);
                timesUp.hidden = true;
                setAnswerVisible(true);
                renderScoreboard();

                if (window.QuizBowl.Data.SettingsDB.getSettings().showScoresAfterAnswer) {
                    showCelebration(t, q.marks);
                } else {
                    // Scores stay hidden; leave the answer on screen until the host closes it
                    Toast.show(`${t.name} got it right! +${q.marks} points`, 'success');
                }
            });

            function showCelebration(team, marksAwarded) {
                const teams = TeamService.getAllTeams();
                const maxScore = teams.length > 0 ? Math.max(...teams.map(t => t.score)) : 1;
                const safeMaxScore = maxScore > 0 ? maxScore : 1;

                document.getElementById('celebration-text').textContent = `🎉 ${team.name} got it right!`;
                document.getElementById('celebration-sub').textContent = `+${marksAwarded} points`;

                const container = document.getElementById('celebration-leaderboard');
                container.innerHTML = '';

                teams.forEach(t => {
                    const isWinner = t.id === team.id;
                    const newScore = t.score;
                    const oldScore = isWinner ? newScore - marksAwarded : newScore;
                    const oldWidth = Math.max(0, (oldScore / safeMaxScore) * 100);
                    const newWidth = Math.max(0, (newScore / safeMaxScore) * 100);

                    const row = document.createElement('div');
                    row.className = `celebration-row ${isWinner ? 'winner' : ''}`;
                    row.innerHTML = `
                        <div class="name">${UI.escapeHtml(t.name)}</div>
                        <div class="track"><div class="fill" style="width: ${oldWidth}%; background: ${UI.teamColor(t)};"></div></div>
                        <div class="score-text">${oldScore}</div>
                    `;
                    container.appendChild(row);

                    if (isWinner) {
                        setTimeout(() => {
                            row.querySelector('.fill').style.width = `${newWidth}%`;
                            const scoreText = row.querySelector('.score-text');
                            const start = performance.now();
                            const tick = (now) => {
                                const progress = Math.min(1, (now - start) / 1000);
                                scoreText.textContent = Math.round(oldScore + (newScore - oldScore) * progress);
                                if (progress < 1) requestAnimationFrame(tick);
                            };
                            requestAnimationFrame(tick);
                        }, 500);
                    }
                });

                overlay.hidden = false;
                fireConfetti();
            }

            function fireConfetti() {
                if (typeof confetti !== 'function') return;
                const duration = 3 * 1000;
                const animationEnd = Date.now() + duration;
                const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 10000 };
                const randomInRange = (min, max) => Math.random() * (max - min) + min;

                clearInterval(confettiInterval);
                confettiInterval = setInterval(() => {
                    const timeLeft = animationEnd - Date.now();
                    if (timeLeft <= 0) return clearInterval(confettiInterval);

                    const particleCount = 50 * (timeLeft / duration);
                    confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
                    confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
                }, 250);
            }

            function closeCelebration() {
                overlay.hidden = true;
                clearInterval(confettiInterval);
                showPicker();
            }

            overlay.addEventListener('click', closeCelebration);

            // ---------- Keyboard shortcuts ----------
            document.addEventListener('keydown', (e) => {
                const typing = e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA';

                if (e.key === 'Escape') {
                    if (!overlay.hidden) closeCelebration();
                    else if (!display.hidden) showPicker();
                    return;
                }
                if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
                    e.preventDefault();
                    if (!display.hidden) showPicker();
                    searchInput.focus();
                    return;
                }
                if (typing || e.ctrlKey || e.metaKey || e.altKey) return;

                if (e.key.toLowerCase() === 'f') toggleFullscreen();
                if (e.key.toLowerCase() === 'a' && !display.hidden && overlay.hidden) btnToggleAnswer.click();
                if (!overlay.hidden && (e.key === 'Enter' || e.key === ' ')) {
                    e.preventDefault();
                    closeCelebration();
                }
            });

            // Refresh when the admin page changes data in another tab
            window.addEventListener('storage', (e) => {
                if (!e.key || !e.key.startsWith('quizbowl_')) return;
                if (e.key === 'quizbowl_theme') {
                    window.QuizBowl.Theme.set(e.newValue === 'dark');
                    return;
                }
                // Admin switched or renamed quizzes: start fresh on the new quiz
                if (e.key === 'quizbowl_active_quiz' || e.key === 'quizbowl_quizzes') {
                    renderQuizName();
                    if (e.key === 'quizbowl_active_quiz') {
                        overlay.hidden = true;
                        clearInterval(confettiInterval);
                        showPicker();
                        return;
                    }
                }
                renderScoreboard();
                if (!picker.hidden) renderPicker();
            });

            renderQuizName();
            showPicker();
        });
    </script>
