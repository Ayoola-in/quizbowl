<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0B1222">

    <!-- Installable web app -->
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Quizr">
    <title>Quizr - Quiz Manager</title>

    <!-- Apply saved theme before first paint to avoid a flash -->
    <script>
        try {
            var savedTheme = localStorage.getItem('quizbowl_theme');
            if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        } catch (e) {}
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/questions.css">
    <link rel="stylesheet" href="css/views.css">
    <link rel="stylesheet" href="css/generate.css">
    <link rel="stylesheet" href="css/account.css">
    <link rel="stylesheet" href="css/host.css">

    <!-- MathJax for rendering Mathematical Expressions -->
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head>

<body>
    <div id="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <a href="#dashboard" class="logo">
                    <span class="logo-icon"><span data-icon="trophy"></span></span>
                    <span>
                        <h1>Quizr</h1>
                        <small>Quiz Manager</small>
                    </span>
                </a>
            </div>
            <div class="quiz-switcher">
                <label for="quiz-select">Current quiz</label>
                <select id="quiz-select" class="quiz-select"></select>
            </div>
            <nav class="sidebar-nav" aria-label="Main navigation">
                <div class="nav-label">Competition</div>
                <a href="#dashboard" class="nav-item active" data-route="dashboard"><span data-icon="dashboard"></span>Dashboard</a>
                <a href="#questions" class="nav-item" data-route="questions"><span data-icon="questions"></span>Questions</a>
                <a href="#generate" class="nav-item" data-route="generate"><span data-icon="sparkles"></span>AI Generator</a>
                <a href="#export" class="nav-item" data-route="export"><span data-icon="download"></span>Export PDF</a>
                <a href="#host" class="nav-item" data-route="host"><span data-icon="play"></span>Host a Quiz</a>
                <a href="#teams" class="nav-item" data-route="teams"><span data-icon="teams"></span>Teams</a>
                <a href="#history" class="nav-item" data-route="history"><span data-icon="history"></span>History</a>
                <div class="nav-label" style="margin-top: var(--spacing-md);">Configuration</div>
                <a href="#settings" class="nav-item" data-route="settings"><span data-icon="settings"></span>Settings</a>
                <a href="#quizzes" class="nav-item" data-route="quizzes"><span data-icon="list"></span>All Quizzes</a>
                <a href="#account" class="nav-item" data-route="account"><span data-icon="cloud"></span><span class="nav-text">Account &amp; Sync</span><span class="cloud-dot" id="cloud-dot" hidden></span></a>
            </nav>
            <div class="sidebar-footer">
                <a href="#" class="nav-item" data-install-app hidden>
                    <span data-icon="download"></span>Install App
                </a>
                <a href="public.html" target="_blank" rel="noopener" class="nav-item">
                    <span data-icon="external"></span>Open Public Display
                </a>
            </div>
        </aside>
        <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header">
                <button class="btn btn-ghost btn-icon menu-toggle" id="btn-menu" aria-label="Open navigation">
                    <span data-icon="menu"></span>
                </button>
                <div class="header-search">
                    <span data-icon="search"></span>
                    <input type="search" id="global-search" placeholder="Search questions..." aria-label="Search questions" autocomplete="off">
                    <kbd>Ctrl K</kbd>
                </div>
                <div class="header-actions">
                    <button class="btn btn-ghost btn-icon" id="btn-theme" aria-label="Toggle dark mode" title="Toggle dark mode">
                        <span data-icon="moon"></span>
                    </button>
                    <a href="public.html" target="_blank" rel="noopener" class="btn btn-secondary hide-in-display hide-on-mobile" title="Open the audience-facing display in a new tab">
                        <span data-icon="external"></span><span class="btn-label-optional">Public Display</span>
                    </a>
                    <button class="btn btn-primary" id="btn-display-mode" title="Hide admin controls for projecting">
                        <span data-icon="monitor"></span><span class="btn-label-optional" id="display-mode-label">Display Mode</span>
                    </button>
                </div>
            </header>

            <div id="view-container" class="view-container">
                <!-- Views will be dynamically loaded here by the router -->
                <div id="loading-state">Initializing Quizr...</div>
            </div>
        </main>
    </div>

    <!-- Scripts (Loaded in dependency order) -->
    <script src="js/app.js"></script>
    <script src="js/pwa.js"></script>
    <script src="js/data/storage.js"></script>
    <!-- Data & Repositories -->
    <script src="js/data/questions-db.js"></script>
    <script src="js/data/teams-db.js"></script>
    <script src="js/data/history-db.js"></script>
    <script src="js/data/settings-db.js"></script>
    <script src="js/data/seed-data.js"></script>
    <script src="js/data/quizzes-db.js"></script>

    <!-- Accounts & cloud sync (optional) -->
    <script src="js/cloud/config.js"></script>
    <script src="js/cloud/cloud.js"></script>
    <script src="js/cloud/host-cloud.js"></script>

    <!-- Services -->
    <script src="js/services/question-service.js"></script>
    <script src="js/services/team-service.js"></script>
    <script src="js/services/scoring-service.js"></script>
    <script src="js/services/host-service.js"></script>
    <script src="js/services/hosting.js"></script>

    <!-- Utils -->
    <script src="js/utils/search.js"></script>
    <script src="js/utils/ui.js"></script>

    <!-- Components -->
    <script src="js/components/toast.js"></script>
    <script src="js/components/modal.js"></script>

    <!-- AI question generator -->
    <script src="js/ai/ai-providers.js"></script>
    <script src="js/ai/doc-extract.js"></script>
    <script src="js/ai/question-generator.js"></script>

    <!-- PDF export -->
    <script src="js/export/pdf-export.js"></script>
    <script src="js/export/export-options.js"></script>

    <!-- Views -->
    <script src="js/views/dashboard.js"></script>
    <script src="js/views/questions.js"></script>
    <script src="js/views/add-question.js"></script>
    <script src="js/views/question.js"></script>
    <script src="js/views/teams.js"></script>
    <script src="js/views/history.js"></script>
    <script src="js/views/settings.js"></script>
    <script src="js/views/quizzes.js"></script>
    <script src="js/views/generate.js"></script>
    <script src="js/views/export.js"></script>
    <script src="js/views/account.js"></script>
    <script src="js/views/host.js"></script>
    <script src="js/views/take.js"></script>

    <!-- Router -->
    <script src="js/router.js"></script>

    <!-- Application Initialization -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Create/upgrade quizzes (seeds sample data on a fresh install)
            window.QuizBowl.Data.QuizzesDB.ensureInitialized();
            window.QuizBowl.App.refreshQuizSwitcher();
            // Migrate old IDs to new type-specific IDs
            window.QuizBowl.Services.QuestionService.migrateIds();
            // Start Router
            window.QuizBowl.Router.init();
            // Optional accounts & cloud sync (does nothing until someone signs in)
            window.QuizBowl.App.watchCloud();
            window.QuizBowl.Cloud.init();
        });
    </script>
</body>

</html>
