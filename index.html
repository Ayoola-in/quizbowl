<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizBowl - Departmental Quiz Management</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/questions.css">

    <!-- MathJax for rendering Mathematical Expressions -->
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head>

<body>
    <div id="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <span class="logo-icon"></span>
                    <h1>QuizBowl</h1>
                </div>
            </div>
            <nav class="sidebar-nav">
                <a href="#dashboard" class="nav-item active" data-route="dashboard">Dashboard</a>
                <a href="#questions" class="nav-item" data-route="questions">Questions</a>
                <a href="#teams" class="nav-item" data-route="teams">Teams</a>
                <a href="#history" class="nav-item" data-route="history">History</a>
                <a href="#settings" class="nav-item" data-route="settings">Settings</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header">
                <div class="header-search">
                    <input type="text" id="global-search" placeholder="Search questions... (Ctrl+K)">
                </div>
                <div class="header-actions">
                    <a href="public.html" target="_blank" class="btn"
                        style="background: var(--bg-surface); border: 1px solid var(--border-color); color: var(--text-primary); text-decoration: none;">Public
                        Display ↗</a>
                    <button class="btn btn-primary" id="btn-display-mode">Display Mode</button>
                </div>
            </header>

            <div id="view-container" class="view-container">
                <!-- Views will be dynamically loaded here by the router -->
                <div id="loading-state">Initializing QuizBowl...</div>
            </div>
        </main>
    </div>

    <!-- Scripts (Loaded in dependency order) -->
    <script src="js/app.js"></script>
    <script src="js/data/storage.js"></script>
    <!-- Data & Repositories -->
    <script src="js/data/questions-db.js"></script>
    <script src="js/data/teams-db.js"></script>
    <script src="js/data/history-db.js"></script>
    <script src="js/data/settings-db.js"></script>
    <script src="js/data/seed-data.js"></script>

    <!-- Services -->
    <script src="js/services/question-service.js"></script>
    <script src="js/services/team-service.js"></script>
    <script src="js/services/scoring-service.js"></script>

    <!-- Utils -->
    <script src="js/utils/search.js"></script>

    <!-- Components -->
    <script src="js/components/toast.js"></script>

    <!-- Views -->
    <script src="js/views/dashboard.js"></script>
    <script src="js/views/questions.js"></script>
    <script src="js/views/add-question.js"></script>
    <script src="js/views/question.js"></script>
    <script src="js/views/teams.js"></script>
    <script src="js/views/history.js"></script>
    <script src="js/views/settings.js"></script>

    <!-- Router -->
    <script src="js/router.js"></script>

    <!-- Application Initialization -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Initialize Seed Data
            window.QuizBowl.Data.initializeSeedData();
            // Migrate old IDs to new type-specific IDs
            window.QuizBowl.Services.QuestionService.migrateIds();
            // Start Router
            window.QuizBowl.Router.init();
        });
    </script>
</body>

</html>
